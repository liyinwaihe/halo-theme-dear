<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}"
>
  <th:block th:fragment="head">
    <title th:text="${#messages.msg('theme.archives') + ' - ' + site.title}"></title>
  </th:block>

  <th:block th:fragment="content">
    <h1 th:text="#{theme.archives}">归档</h1>

    <div class="archive-group" th:each="archive : ${archives.items}">
      <h2 th:text="${archive.year}"></h2>
      <div th:each="month : ${archive.months}">
        <p class="archive-month" th:text="#{theme.month(${month.month})}"></p>
        <th:block
          th:replace="~{modules/post-list :: list(items=${month.posts})}"
        ></th:block>
      </div>
    </div>

    <p class="empty-note" th:if="${#lists.isEmpty(archives.items)}" th:text="#{theme.no_posts}"></p>

    <nav th:replace="~{modules/pagination :: pager(pagination=${archives})}"></nav>
  </th:block>
</html>
