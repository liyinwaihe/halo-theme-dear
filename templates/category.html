<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}"
>
  <th:block th:fragment="head">
    <title th:text="|${category.spec.displayName} - ${site.title}|"></title>
  </th:block>

  <th:block th:fragment="content">
    <h1>
      <span th:text="#{theme.category_label}">分类</span>
      <span th:text="${category.spec.displayName}"></span>
    </h1>
    <p
      class="intro"
      th:if="${not #strings.isEmpty(category.spec.description)}"
      th:text="${category.spec.description}"
    ></p>

    <th:block th:if="${not #lists.isEmpty(posts.items)}">
      <th:block
        th:replace="~{modules/post-list :: list(items=${posts.items})}"
      ></th:block>
    </th:block>
    <p class="empty-note" th:if="${#lists.isEmpty(posts.items)}" th:text="#{theme.no_posts}"></p>

    <nav th:replace="~{modules/pagination :: pager(pagination=${posts})}"></nav>

    <p class="pager">
      <a th:href="@{${site.routes?.categoriesUri ?: '/categories'}}"
        >← <span th:text="#{theme.all_categories}">分类</span></a
      >
    </p>
  </th:block>
</html>
