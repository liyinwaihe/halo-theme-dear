<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}"
>
  <th:block th:fragment="head">
    <title th:text="${(error?.status ?: 500) + ' - ' + site.title}"></title>
  </th:block>

  <th:block th:fragment="content">
    <h1 th:text="${error?.status ?: 500}">500</h1>
    <p
      class="intro"
      th:text="${#strings.defaultString(error?.title, #messages.msg('theme.error_hint'))}"
    ></p>
    <p class="pager">
      <a th:href="@{/}" th:text="#{theme.not_found_home}">回到首页</a>
    </p>
  </th:block>
</html>
