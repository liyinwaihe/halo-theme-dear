<footer th:fragment="footer" xmlns:th="https://www.thymeleaf.org">
  <p
    th:text="${#strings.isEmpty(theme.config?.footer?.text) ? site.title : theme.config?.footer?.text}"
  ></p>

  <button
    class="theme-toggle"
    id="dear-theme-toggle"
    type="button"
    th:if="${theme.config?.style?.show_toggle != false}"
    th:aria-label="#{theme.toggle_theme}"
  >
    <span class="icon-sun">
      <svg
        viewBox="0 0 24 24"
        width="20"
        height="20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4.2" />
        <path
          d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7"
        />
      </svg>
    </span>
    <span class="icon-moon">
      <svg
        viewBox="0 0 24 24"
        width="20"
        height="20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M20.2 13.6A8.2 8.2 0 0 1 10.4 3.8a8.2 8.2 0 1 0 9.8 9.8Z" />
      </svg>
    </span>
  </button>
</footer>
