apiVersion: v1alpha1
kind: Setting
metadata:
  # 必须与 theme.yaml 的 spec.settingName 一致
  name: theme-dear-setting
spec:
  forms:
    - group: style
      label: 样式
      formSchema:
        - $formkit: radio
          name: color_scheme
          label: 默认配色
          value: system
          options:
            - label: 跟随系统
              value: system
            - label: 深色
              value: dark
            - label: 浅色
              value: light
          help: 读者手动切换后，浏览器会记住其选择。
        - $formkit: checkbox
          name: show_toggle
          label: 显示主题切换按钮
          value: true
          help: 关闭后页脚不再显示圆形切换按钮。
        - $formkit: checkbox
          name: show_search
          label: 显示搜索框
          value: false
          help: 需要先安装官方「搜索」插件，否则搜索链接会 404。
    - group: layout
      label: 布局
      formSchema:
        - $formkit: textarea
          name: intro
          label: 首页引导文字
          value: ""
          rows: 3
          placeholder: 留空则显示站点副标题
          help: 显示在首页文章列表上方的一段说明文字。
    - group: footer
      label: 页脚
      formSchema:
        - $formkit: text
          name: text
          label: 页脚文字
          value: ""
          placeholder: 留空则显示站点标题
